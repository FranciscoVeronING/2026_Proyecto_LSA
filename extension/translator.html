<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Intérprete LSA</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="translator">
    <div class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div class="rec-dot" id="rec"></div>
    </div>
    <aside class="panel">
      <h1>Intérprete LSA</h1>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="health-text">Conectando…</span>
      </div>
      <div>
        <div class="hint">Mano dominante</div>
        <div class="toggle" id="hand-toggle">
          <button type="button" data-hand="right" class="active">Derecha</button>
          <button type="button" data-hand="left">Izquierda</button>
        </div>
      </div>
      <div>
        <div class="hint">Glosas</div>
        <div class="glosses" id="glosses">(vacío)</div>
      </div>
      <div>
        <div class="hint">Español</div>
        <div class="spanish" id="spanish">—</div>
      </div>
      <div class="top3" id="top3"></div>
      <div class="hint" id="cap-debug">Cámara detenida</div>
      <div class="row">
        <button id="btn-start" type="button">Iniciar cámara</button>
        <button class="ghost" id="btn-clear" type="button">Limpiar contexto</button>
      </div>
      <p class="hint">
        Seña = buffer de frames, igual que en integración. Pausa de 4 s sin
        movimiento → fin de oración → módulo semántico.
      </p>
    </aside>
  </div>
  <canvas id="motion" width="320" height="240" hidden></canvas>
  <canvas id="frame-in" hidden></canvas>
  <iframe id="mp-sandbox" hidden></iframe>
  <script src="lib/api.js"></script>
  <script src="lib/landmarks.js"></script>
  <script src="lib/capture.js"></script>
  <script src="translator.js"></script>
</body>
</html>
