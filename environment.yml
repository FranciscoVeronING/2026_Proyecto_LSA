# Entorno conda recomendado para el clasificador LSA
#
# Crear desde cero:
#   conda env create -f environment.yml
#   conda activate lsa_gpu
#   cd src/holistic_web && npm install && npx playwright install chromium
#
# Verificar:
#   cd src
#   python check_env.py

name: lsa_gpu
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - matplotlib
  - tqdm
  - scikit-learn
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - pip:
      - "numpy>=1.26.0"
      - "opencv-python>=4.8.0,<5"
